# Deploying Sakha to Render.
#
# Render looks for this file at the repo root on the branch you point the
# Blueprint at. Without it the Blueprint page just says "render.yaml not found",
# which is what it means: not a build failure, a missing file.
#
# One service, because the WebSocket relay MUST live on the same origin as the
# page. Render gives a service exactly one port, and the /voice/stream upgrade
# is handled on the same http.Server as Express (see src/server.js).
#
# ⚠️ READ THIS BEFORE TRUSTING IT WITH REAL PEOPLE — free instances have NO
# persistent disk. Sakha's memory is data/users/<phone>.json, so on the free plan
# every remembered fact is erased on each deploy, each restart, and each wake
# from sleep. An elder who told Sakha about her grandson on Tuesday meets a
# stranger on Wednesday, which is the one failure this product cannot afford.
# Free is fine for a demo. Before real users, do ONE of:
#   1. Set DATABASE_URL below to any Postgres (Render's free Postgres, Neon,
#      Supabase). Memory then lives in one jsonb row per person and survives
#      every deploy and wake. The boot line and /healthz confirm which store is
#      live. This is the free fix.
#   2. Move to a paid instance and uncomment the disk block below.
#
# Free instances also sleep after ~15 minutes idle and take ~30s to wake. The
# first caller after a sleep waits through that before Sakha says hello.

# The database is provisioned by this same Blueprint, so memory survives
# redeploys with no wiring by hand — DATABASE_URL below is filled in from it.
# ⚠️ Render's FREE Postgres is deleted 30 days after creation, data included.
# Fine for the phone-testing phase; before real elders either upgrade this
# database to a paid plan or point DATABASE_URL at a Neon/Supabase free
# instance instead (those do not expire).
databases:
  - name: sakha-memory
    plan: free
    region: singapore # same region as the service — memory reads sit on the call path
    postgresMajorVersion: "16"

services:
  - type: web
    name: krishna-sakha
    runtime: node
    plan: free
    region: singapore # closest Render region to India — every call's audio crosses it twice
    buildCommand: npm install
    startCommand: npm start
    # Not "/" — that is a redirect to /m, and a checker that does not follow
    # redirects would read it as the service being down.
    healthCheckPath: /healthz

    # disk:                        # paid instances only
    #   name: sakha-memory
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1

    envVars:
      # Do NOT set PORT. Render injects it, and src/server.js already reads it.
      - key: NODE_VERSION
        value: "22"

      # ── Memory that outlives the container (OPEN-ISSUES #1) ──
      # Filled from the Blueprint's own database above. To use a different
      # Postgres (Neon, Supabase), replace fromDatabase with the URL in the
      # dashboard. Unset = local files, which a diskless host erases on every
      # deploy — fine for a demo, fatal for a real elder.
      - key: DATABASE_URL
        fromDatabase:
          name: sakha-memory
          property: connectionString

      # ── Sarvam: the hearing AND the speaking, on WhatsApp and on calls ──
      # The one key this product cannot run without. Set it in the dashboard.
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_STT_MODEL
        value: saarika:v2.5
      - key: SARVAM_TTS_MODEL
        value: bulbul:v3
      - key: SARVAM_TTS_SPEAKER
        value: aditya
      - key: SARVAM_TTS_PACE
        value: "1.0"

      # ── Claude: the thinking ──
      # Without this the service still boots and /m still runs a whole call —
      # the boot line says [partial] and Sakha's replies come from a script.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-5
      - key: CLAUDE_EFFORT
        value: low
      # Sonnet on calls, not Opus: a call turn is latency-bound and every extra
      # second is an elder sitting in silence wondering if the line dropped.
      - key: VOICE_MODEL
        value: claude-sonnet-5

      # ── WhatsApp (Meta Cloud API) ──
      # Only the voice-note half needs these. /m works without any of them.
      # ⚠️ WHATSAPP_TOKEN from the Meta test console expires every ~24h. Use a
      # permanent system-user token here or the WhatsApp side 401s every morning
      # while the call page keeps working, which is a confusing way to find out.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: GRAPH_VERSION
        value: v23.0
      # Worth the spend once deployed: the first caller after a wake-up is
      # very often the only caller. Off locally, where the server restarts all day.
      - key: VOICE_PREWARM
        value: "true"
      - key: SARVAM_TTS_PITCH
        value: "0"
      - key: FREE_TRIAL_MINUTES
        value: "15"
      - key: ANON_CALL_MINUTES
        value: "5"
